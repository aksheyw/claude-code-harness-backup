<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="figTitle">
  <title id="figTitle">What a reinstall gives you back, and what it doesn't</title>

  <rect x="0" y="0" width="1000" height="600" fill="#FFFFFF"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="32" y="46" font-size="25" font-weight="700" fill="#1B2A4A">What a reinstall gives you back, and what it doesn't</text>

    <!-- LEFT: the part that comes back on its own -->
    <text x="32" y="92" font-size="14" font-weight="700" fill="#8A8F98" letter-spacing="0.6">YOU CAN GET THIS BACK</text>

    <g>
      <rect x="32" y="108" width="452" height="64" rx="8" fill="#F5F6F7" stroke="#B9BEC6" stroke-width="1"/>
      <text x="50" y="134" font-size="16" font-weight="700" fill="#5B6169">Claude Code itself</text>
      <text x="50" y="156" font-size="13" fill="#8A8F98">Reinstall and sign in</text>
      <text x="466" y="146" font-size="17" font-weight="700" fill="#8A8F98" text-anchor="end">2 min</text>
    </g>

    <g>
      <rect x="32" y="186" width="452" height="64" rx="8" fill="#F5F6F7" stroke="#B9BEC6" stroke-width="1"/>
      <text x="50" y="212" font-size="16" font-weight="700" fill="#5B6169">Plugins from a marketplace</text>
      <text x="50" y="234" font-size="13" fill="#8A8F98">Reinstall from the list. Local uploads do not</text>
    </g>

    <g>
      <rect x="32" y="264" width="452" height="64" rx="8" fill="#F5F6F7" stroke="#B9BEC6" stroke-width="1"/>
      <text x="50" y="302" font-size="16" font-weight="700" fill="#5B6169">Your projects, if they are pushed</text>
    </g>

    <!-- RIGHT: the authored harness -->
    <text x="516" y="92" font-size="14" font-weight="700" fill="#B42318" letter-spacing="0.6">DOESN'T COME BACK. YOU WROTE IT.</text>

    <g>
      <rect x="516" y="108" width="452" height="64" rx="8" fill="#E6F4F1" stroke="#0E9384" stroke-width="1"/>
      <text x="534" y="134" font-size="16" font-weight="700" fill="#0B6E5F">Rules</text>
      <text x="534" y="156" font-size="13" fill="#5B6169">Standing instructions, loaded into every session</text>
      <text x="950" y="140" font-size="19" font-weight="700" fill="#0B6E5F" text-anchor="end">27</text>
    </g>

    <g>
      <rect x="516" y="186" width="452" height="64" rx="8" fill="#E6F4F1" stroke="#0E9384" stroke-width="1"/>
      <text x="534" y="212" font-size="16" font-weight="700" fill="#0B6E5F">Skills</text>
      <text x="534" y="234" font-size="13" fill="#5B6169">Playbooks it follows when a task matches</text>
      <text x="950" y="218" font-size="19" font-weight="700" fill="#0B6E5F" text-anchor="end">304</text>
    </g>

    <g>
      <rect x="516" y="264" width="452" height="64" rx="8" fill="#E6F4F1" stroke="#0E9384" stroke-width="1"/>
      <text x="534" y="290" font-size="16" font-weight="700" fill="#0B6E5F">Subagents</text>
      <text x="534" y="312" font-size="13" fill="#5B6169">Separate assistants, one job each. Folder: agents/</text>
      <text x="950" y="296" font-size="19" font-weight="700" fill="#0B6E5F" text-anchor="end">93</text>
    </g>

    <g>
      <rect x="516" y="342" width="452" height="64" rx="8" fill="#E6F4F1" stroke="#0E9384" stroke-width="1"/>
      <text x="534" y="368" font-size="16" font-weight="700" fill="#0B6E5F">Commands</text>
      <text x="534" y="390" font-size="13" fill="#5B6169">Shortcuts you type to start something you do often</text>
      <text x="950" y="374" font-size="19" font-weight="700" fill="#0B6E5F" text-anchor="end">114</text>
    </g>

    <g>
      <rect x="516" y="420" width="452" height="64" rx="8" fill="#E6F4F1" stroke="#0E9384" stroke-width="1"/>
      <text x="534" y="446" font-size="16" font-weight="700" fill="#0B6E5F">Hook scripts</text>
      <text x="534" y="468" font-size="13" fill="#5B6169">Scripts that fire automatically and can block an action</text>
      <text x="950" y="452" font-size="19" font-weight="700" fill="#0B6E5F" text-anchor="end">58</text>
    </g>

    <text x="516" y="506" font-size="12" fill="#8A8F98">Counts from one real run, on my own machine.</text>

    <!-- bottom band -->
    <rect x="32" y="524" width="936" height="52" rx="8" fill="#FDF6F5" stroke="#E8D5D2" stroke-width="1"/>
    <text x="52" y="547" font-size="15" font-weight="700" fill="#5C4A47">Nothing on the right reinstalls. It exists because you taught it, on exactly one laptop.</text>
    <text x="52" y="567" font-size="13" fill="#5C4A47">This repo copies that side to a folder you can move, and tells you what it could not save.</text>

  </g>
</svg>
